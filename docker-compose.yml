services:
  postgres:
    image: postgres:15-alpine
    container_name: nextproject-postgres
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      POSTGRES_DB: nextproject
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${DB_PASSWORD:-nextproject2025}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d nextproject"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: nextproject-redis
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis2025}
    command: redis-server /usr/local/etc/redis/redis.conf --requirepass ${REDIS_PASSWORD:-redis2025}
    volumes:
      - redis_data:/data
      - ./config/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    stop_grace_period: 30s

  main-service:
    image: nextproject-main-service:latest
    build:
      context: .
      dockerfile: main_service/Dockerfile
      args:
        INSTALL_DEV: "false"
    container_name: nextproject-main-service
    restart: unless-stopped
    volumes:
      - ./data:/shared
      - ./generated_sites:/generated_sites
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://admin:nextproject2025@postgres:5432/nextproject}
      - SYNC_DATABASE_URL=${SYNC_DATABASE_URL:-postgresql+psycopg://admin:nextproject2025@postgres:5432/nextproject}
      - REDIS_URL=${REDIS_URL:-redis://:redis2025@redis:6379/0}
      - AUTH_SESSION_BACKEND=${AUTH_SESSION_BACKEND:-redis}
      - AUTH_SESSION_KEY_PREFIX=${AUTH_SESSION_KEY_PREFIX:-nextproject:auth}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://:redis2025@redis:6379/0}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND:-redis://:redis2025@redis:6379/1}
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required}
      - FERNET_KEY=${FERNET_KEY:?FERNET_KEY is required}
      - PROGRAMMING_TOOL_ADAPTER_TOKEN=${PROGRAMMING_TOOL_ADAPTER_TOKEN:?PROGRAMMING_TOOL_ADAPTER_TOKEN is required}
      - CODEX_ADAPTER_URL=http://codex-adapter:8090
      - CLAUDE_CODE_ADAPTER_URL=http://claude-code-adapter:8091
      - CODEBUDDY_ADAPTER_URL=http://codebuddy-adapter:8092
      - OPENCODE_ADAPTER_URL=http://opencode-adapter:8093
      - KIMI_CODE_ADAPTER_URL=http://kimi-code-adapter:8094
      - LLM_DIALOG_LOG_ENABLED=${LLM_DIALOG_LOG_ENABLED:-false}
      - LLM_DIALOG_LOG_MAX_CHARS=${LLM_DIALOG_LOG_MAX_CHARS:-4000}
      - SUB_SITE_PORT_START=${SUB_SITE_PORT_START:-19100}
      - SUB_SITE_PORT_END=${SUB_SITE_PORT_END:-19999}
      - AGENT_TASK_WORKERS=${AGENT_TASK_WORKERS:-2}
      - PLAYWRIGHT_BASE_URL=${PLAYWRIGHT_BASE_URL:-http://127.0.0.1:8080}
      - GENERATED_SITES_ROOT=/generated_sites
      - TASK_ARTIFACTS_ROOT=/shared/task_artifacts
      - PROGRAMMING_SESSION_ROOT=/shared/programming_sessions
      - CORS_ALLOW_ORIGINS=${CORS_ALLOW_ORIGINS:-http://localhost:20100,http://127.0.0.1:20100}
      - CORS_ALLOW_CREDENTIALS=${CORS_ALLOW_CREDENTIALS:-true}
      - TECH_PLATFORM_BASE_URL=${TECH_PLATFORM_BASE_URL:-http://192.168.1.15:90}
      - TECH_PLATFORM_USERNAME=${TECH_PLATFORM_USERNAME:-}
      - TECH_PLATFORM_PASSWORD=${TECH_PLATFORM_PASSWORD:-}
      - TECH_PLATFORM_SYSTEM_ID=${TECH_PLATFORM_SYSTEM_ID:-B6EF6BD39FE8C3DCA1B5E13AAD516BC3}
      - TECH_PLATFORM_VERIFY_SSL=${TECH_PLATFORM_VERIFY_SSL:-false}
      - HARBOR_REGISTRY=${HARBOR_REGISTRY:-harbor.trscd.com.cn}
      - HARBOR_PROJECT=${HARBOR_PROJECT:-ocean-km}
      - DOCKER_BUILD_PLATFORM=${DOCKER_BUILD_PLATFORM:-linux/amd64}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - default
      - programming-adapters
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  codex-adapter:
    build:
      context: .
      dockerfile: programming_tool_adapter/Dockerfile
      args:
        TOOL_ID: codex
    container_name: nextproject-codex-adapter
    restart: unless-stopped
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - TOOL_ID=codex
      - PORT=8090
      - PROGRAMMING_TOOL_ADAPTER_TOKEN=${PROGRAMMING_TOOL_ADAPTER_TOKEN:?PROGRAMMING_TOOL_ADAPTER_TOKEN is required}
      - TASK_ARTIFACTS_ROOT=/shared/task_artifacts
      - PROGRAMMING_SESSION_ROOT=/shared/programming_sessions
    volumes:
      - ./data/codex_home:/root/.codex
      - ./data/programming_sessions:/shared/programming_sessions
      - ./data/task_artifacts:/shared/task_artifacts
      - ./generated_sites:/generated_sites
    tmpfs:
      - /run/nextproject-adapter:mode=0700
    networks:
      programming-adapters:
        aliases:
          - codex-mcp
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  claude-code-adapter:
    build:
      context: .
      dockerfile: programming_tool_adapter/Dockerfile
      args:
        TOOL_ID: claude_code
    container_name: nextproject-claude-code-adapter
    restart: unless-stopped
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - TOOL_ID=claude_code
      - PORT=8091
      - PROGRAMMING_TOOL_ADAPTER_TOKEN=${PROGRAMMING_TOOL_ADAPTER_TOKEN:?PROGRAMMING_TOOL_ADAPTER_TOKEN is required}
      - TASK_ARTIFACTS_ROOT=/shared/task_artifacts
      - PROGRAMMING_SESSION_ROOT=/shared/programming_sessions
    volumes:
      - ./data/claude_home:/root/.claude
      - ./data/claude_config:/root/.config/claude-code
      - ./data/programming_sessions:/shared/programming_sessions
      - ./data/task_artifacts:/shared/task_artifacts
      - ./generated_sites:/generated_sites
    tmpfs:
      - /run/nextproject-adapter:mode=0700
    networks:
      programming-adapters:
        aliases:
          - claude-code-mcp
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8091/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  codebuddy-adapter:
    build:
      context: .
      dockerfile: programming_tool_adapter/Dockerfile
      args:
        TOOL_ID: codebuddy
    container_name: nextproject-codebuddy-adapter
    restart: unless-stopped
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - TOOL_ID=codebuddy
      - PORT=8092
      - PROGRAMMING_TOOL_ADAPTER_TOKEN=${PROGRAMMING_TOOL_ADAPTER_TOKEN:?PROGRAMMING_TOOL_ADAPTER_TOKEN is required}
      - TASK_ARTIFACTS_ROOT=/shared/task_artifacts
      - PROGRAMMING_SESSION_ROOT=/shared/programming_sessions
    volumes:
      - ./data/programming_sessions:/shared/programming_sessions
      - ./data/task_artifacts:/shared/task_artifacts
      - ./generated_sites:/generated_sites
    tmpfs:
      - /run/nextproject-adapter:mode=0700
    networks:
      - programming-adapters
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8092/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  opencode-adapter:
    build:
      context: .
      dockerfile: programming_tool_adapter/Dockerfile
      args:
        TOOL_ID: opencode
    container_name: nextproject-opencode-adapter
    restart: unless-stopped
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - TOOL_ID=opencode
      - PORT=8093
      - PROGRAMMING_TOOL_ADAPTER_TOKEN=${PROGRAMMING_TOOL_ADAPTER_TOKEN:?PROGRAMMING_TOOL_ADAPTER_TOKEN is required}
      - TASK_ARTIFACTS_ROOT=/shared/task_artifacts
      - PROGRAMMING_SESSION_ROOT=/shared/programming_sessions
    volumes:
      - ./data/programming_sessions:/shared/programming_sessions
      - ./data/task_artifacts:/shared/task_artifacts
      - ./generated_sites:/generated_sites
    tmpfs:
      - /run/nextproject-adapter:mode=0700
    networks:
      - programming-adapters
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8093/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  kimi-code-adapter:
    build:
      context: .
      dockerfile: programming_tool_adapter/Dockerfile
      args:
        TOOL_ID: kimi_code
    container_name: nextproject-kimi-code-adapter
    restart: unless-stopped
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - TOOL_ID=kimi_code
      - PORT=8094
      - PROGRAMMING_TOOL_ADAPTER_TOKEN=${PROGRAMMING_TOOL_ADAPTER_TOKEN:?PROGRAMMING_TOOL_ADAPTER_TOKEN is required}
      - TASK_ARTIFACTS_ROOT=/shared/task_artifacts
      - PROGRAMMING_SESSION_ROOT=/shared/programming_sessions
    volumes:
      - ./data/programming_sessions:/shared/programming_sessions
      - ./data/task_artifacts:/shared/task_artifacts
      - ./generated_sites:/generated_sites
    tmpfs:
      - /run/nextproject-adapter:mode=0700
    networks:
      - programming-adapters
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8094/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  celery-worker:
    image: nextproject-main-service:latest
    container_name: nextproject-celery-worker
    restart: unless-stopped
    command: celery -A backend.core.celery_app worker -Q default,ai-tasks,deploy-tasks,test-tasks -c 4 -l info
    volumes:
      - ./data:/shared
      - ./generated_sites:/generated_sites
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data/docker-config/config.json:/root/.docker/config.json:ro
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://admin:nextproject2025@postgres:5432/nextproject}
      - SYNC_DATABASE_URL=${SYNC_DATABASE_URL:-postgresql+psycopg://admin:nextproject2025@postgres:5432/nextproject}
      - REDIS_URL=${REDIS_URL:-redis://:redis2025@redis:6379/0}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://:redis2025@redis:6379/0}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND:-redis://:redis2025@redis:6379/1}
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required}
      - FERNET_KEY=${FERNET_KEY:?FERNET_KEY is required}
      - GENERATED_SITES_ROOT=/generated_sites
      - TASK_ARTIFACTS_ROOT=/shared/task_artifacts
      - PROGRAMMING_SESSION_ROOT=/shared/programming_sessions
      - PLAYWRIGHT_BASE_URL=${PLAYWRIGHT_BASE_URL:-http://127.0.0.1:8080}
      - PROGRAMMING_TOOL_ADAPTER_TOKEN=${PROGRAMMING_TOOL_ADAPTER_TOKEN:?PROGRAMMING_TOOL_ADAPTER_TOKEN is required}
      - CODEX_ADAPTER_URL=http://codex-adapter:8090
      - CLAUDE_CODE_ADAPTER_URL=http://claude-code-adapter:8091
      - CODEBUDDY_ADAPTER_URL=http://codebuddy-adapter:8092
      - OPENCODE_ADAPTER_URL=http://opencode-adapter:8093
      - KIMI_CODE_ADAPTER_URL=http://kimi-code-adapter:8094
      - TECH_PLATFORM_BASE_URL=${TECH_PLATFORM_BASE_URL:-http://192.168.1.15:90}
      - TECH_PLATFORM_USERNAME=${TECH_PLATFORM_USERNAME:-}
      - TECH_PLATFORM_PASSWORD=${TECH_PLATFORM_PASSWORD:-}
      - TECH_PLATFORM_SYSTEM_ID=${TECH_PLATFORM_SYSTEM_ID:-B6EF6BD39FE8C3DCA1B5E13AAD516BC3}
      - TECH_PLATFORM_VERIFY_SSL=${TECH_PLATFORM_VERIFY_SSL:-false}
      - HARBOR_REGISTRY=${HARBOR_REGISTRY:-harbor.trscd.com.cn}
      - HARBOR_PROJECT=${HARBOR_PROJECT:-ocean-km}
      - DOCKER_BUILD_PLATFORM=${DOCKER_BUILD_PLATFORM:-linux/amd64}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      main-service:
        condition: service_healthy
    networks:
      - default
      - programming-adapters
    healthcheck:
      test: ["CMD-SHELL", "celery -A backend.core.celery_app inspect ping -d celery@$$HOSTNAME | grep -q pong"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  celery-beat:
    profiles:
      - scheduler
    image: nextproject-main-service:latest
    container_name: nextproject-celery-beat
    restart: unless-stopped
    command: celery -A backend.core.celery_app beat -l info
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://:redis2025@redis:6379/0}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND:-redis://:redis2025@redis:6379/1}
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required}
      - FERNET_KEY=${FERNET_KEY:?FERNET_KEY is required}
    depends_on:
      - redis

  flower:
    profiles:
      - monitoring
    image: nextproject-main-service:latest
    container_name: nextproject-flower
    restart: unless-stopped
    command: celery -A backend.core.celery_app flower --port=5555 --basic-auth=${FLOWER_USER:-admin}:${FLOWER_PASSWORD:-admin2025}
    ports:
      - "20101:5555"   # Celery 任务监控
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://:redis2025@redis:6379/0}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND:-redis://:redis2025@redis:6379/1}
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required}
      - FERNET_KEY=${FERNET_KEY:?FERNET_KEY is required}
    depends_on:
      - redis

  prometheus:
    profiles:
      - monitoring
    image: prom/prometheus:latest
    container_name: nextproject-prometheus
    restart: unless-stopped
    environment:
      - TZ=${TZ:-Asia/Shanghai}
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    depends_on:
      - main-service
      - flower

  grafana:
    profiles:
      - monitoring
    image: grafana/grafana:latest
    container_name: nextproject-grafana
    restart: unless-stopped
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin2025}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    ports:
      - "20103:3000"   # Grafana 监控面板
    depends_on:
      - prometheus

  test:
    profiles:
      - test
    build:
      context: .
      dockerfile: main_service/Dockerfile
      args:
        INSTALL_DEV: "true"
    container_name: nextproject-test
    command: pytest backend/tests/ -v --cov=backend --cov-report=term-missing
    volumes:
      - .:/app
      - ./data:/shared
      - ./generated_sites:/generated_sites
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - DATABASE_URL=sqlite+aiosqlite:////shared/test_app.db
      - SYNC_DATABASE_URL=sqlite:////shared/test_app.db
      - REDIS_URL=${REDIS_URL:-redis://:redis2025@redis:6379/0}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://:redis2025@redis:6379/0}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND:-redis://:redis2025@redis:6379/1}
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required}
      - FERNET_KEY=${FERNET_KEY:-dGVzdC1mZXJuZXQta2V5LWZvci10ZXN0aW5nMTIzNDU=}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nextproject-frontend
    restart: unless-stopped
    environment:
      - TZ=${TZ:-Asia/Shanghai}
    ports:
      - "20100:80"     # 前端入口
    depends_on:
      main-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  programming-adapters:
    driver: bridge
