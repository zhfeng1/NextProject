dir /data

# AOF is the primary durability mechanism. everysec limits the normal crash
# window to about one second while keeping login/session writes responsive.
appendonly yes
appendfsync everysec
aof-use-rdb-preamble yes
appenddirname appendonlydir

# Keep periodic RDB snapshots as an additional recovery option.
save 900 1
save 300 10
save 60 10000
dbfilename dump.rdb

# Redis should finish persistence work cleanly during container restarts.
stop-writes-on-bgsave-error yes
