<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Python Vue Starter</title>
    <link rel="stylesheet" href="/assets/styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="hero">
        <p class="eyebrow">NextProject Starter</p>
        <h1>Python 后端站点已就绪</h1>
        <p class="lead">
          这个模板使用 FastAPI 提供 API 和静态前端，适合内网、离线和 Docker 部署场景。
        </p>
        <div class="actions">
          <button id="check-api" type="button">检查 API</button>
          <span id="api-status" class="status">等待检查</span>
        </div>
      </section>

      <section class="grid">
        <article>
          <h2>Python Backend</h2>
          <p>后端入口位于 <code>backend/app.py</code>，默认暴露 <code>/api/health</code> 和 <code>/api/info</code>。</p>
        </article>
        <article>
          <h2>Offline First</h2>
          <p>前端资源全部在本仓库内，不依赖 CDN，不需要 Cloudflare Worker 或 Sites 托管。</p>
        </article>
        <article>
          <h2>Docker Ready</h2>
          <p>可以使用仓库内的 Dockerfile 或 docker-compose.yml 在离线环境中构建运行。</p>
        </article>
      </section>
    </main>
    <script src="/assets/app.js"></script>
  </body>
</html>
