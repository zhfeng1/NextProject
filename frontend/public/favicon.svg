<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">NextProject logo</title>
  <desc id="desc">A project workflow mark with connected nodes forming the letter N.</desc>
  <defs>
    <linearGradient id="bg" x1="8" y1="6" x2="58" y2="60" gradientUnits="userSpaceOnUse">
      <stop stop-color="#102033"/>
      <stop offset="1" stop-color="#050B14"/>
    </linearGradient>
    <linearGradient id="path" x1="15" y1="48" x2="50" y2="16" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE"/>
      <stop offset=".52" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#34D399"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.13 0 0 0 0 0.82 0 0 0 0 0.92 0 0 0 .42 0"/>
      <feBlend in="SourceGraphic"/>
    </filter>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#bg)"/>
  <path d="M14 46V18c0-2.2 1.8-4 4-4h28c2.2 0 4 1.8 4 4v28c0 2.2-1.8 4-4 4H18c-2.2 0-4-1.8-4-4Z" fill="none" stroke="#1E293B" stroke-width="2"/>
  <path d="M20 46V20l24 24V18" fill="none" stroke="url(#path)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <path d="M20 46V20l24 24V18" fill="none" stroke="#DFFBFF" stroke-opacity=".9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="20" cy="46" r="5.5" fill="#07111F" stroke="#22D3EE" stroke-width="3"/>
  <circle cx="20" cy="20" r="5.5" fill="#07111F" stroke="#38BDF8" stroke-width="3"/>
  <circle cx="44" cy="44" r="5.5" fill="#07111F" stroke="#2DD4BF" stroke-width="3"/>
  <circle cx="44" cy="18" r="5.5" fill="#07111F" stroke="#34D399" stroke-width="3"/>
  <path d="M50 10l1.2 3.1 3.2 1.2-3.2 1.2L50 19.6l-1.2-3.1-3.2-1.2 3.2-1.2L50 10Z" fill="#A7F3D0"/>
